<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ralph Brief</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 17px/1.5 -apple-system, system-ui, sans-serif;
         background: #0f1419; color: #e6e9ec; }
  .card { padding: 32px 28px; max-width: 360px; text-align: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3fb950;
          display: inline-block; margin-right: 8px; box-shadow: 0 0 12px #3fb950; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { margin: 6px 0; color: #9aa4ad; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="dot"></span>Ralph is live</h1>
  <p>Deployed from the box through the bridge.</p>
  <p>Sat Oct 31, 02:55 PM</p>
</div>
</body>
</html>
